/* ================== CONFETTI ANIMATION ================== */
function triggerConfetti() {
  const c = document.getElementById('confettiCanvas');
  const ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  const pieces = [];
  const colors = ['#E9614C', '#1C9C90', '#F2A93B', '#6C5B9E', '#3FAE5A'];
  for (let i = 0; i < 60; i++) {
    pieces.push({
      x: Math.random() * c.width,
      y: Math.random() * c.height - c.height,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      speed: Math.random() * 4 + 2,
      velX: Math.random() * 2 - 1
    });
  }
  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, c.width, c.height);
    pieces.forEach(p => {
      p.y += p.speed;
      p.x += p.velX;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    frame++;
    if (frame < 120) requestAnimationFrame(animate);
    else ctx.clearRect(0, 0, c.width, c.height);
  }
  animate();
}

/* ================== AUDIO SFX ENGINE ================== */
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = AudioContextClass ? new AudioContextClass() : null;
function playSFX(type) {
  try {
    if(!audioCtx || sfxVolume <= 0) return; if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    if(type === 'win'){
      triggerConfetti();
      osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
      osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.3);
      gainNode.gain.setValueAtTime(sfxVolume, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      gainNode.gain.setValueAtTime(sfxVolume, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    }
  } catch(e){}
}

/* ================== SMART HYBRID AUDIO ENGINE ================== */
let audioSpeechPlayer = new Audio();
let arabicVoice = null;
let voiceUnlocked = false;
let availableVoices = [];

const voiceSelect = document.getElementById('voiceSelect');
const noVoiceModal = document.getElementById('noArabicVoiceModal');
const closeNoVoiceBtn = document.getElementById('closeNoVoiceBtn');

function populateVoiceList() {
  if (!('speechSynthesis' in window)) return;
  availableVoices = window.speechSynthesis.getVoices();
  
  if (!voiceSelect) return;
  voiceSelect.innerHTML = '';

  const arVoices = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
  const voicesToDisplay = arVoices.length > 0 ? arVoices : availableVoices;

  voicesToDisplay.forEach((voice) => {
    const option = document.createElement('option');
    option.textContent = `${voice.name} (${voice.lang})`;
    option.setAttribute('data-name', voice.name);
    
    if (arabicVoice && arabicVoice.name === voice.name) {
      option.selected = true;
    }
    voiceSelect.appendChild(option);
  });

  if (voicesToDisplay.length === 0) {
    const option = document.createElement('option');
    option.textContent = 'لا توجد أصوات مثبتة على الجهاز';
    voiceSelect.appendChild(option);
  }
}

function pickBestArabicVoice() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) return;

  const arVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
  
  if (arVoices.length === 0) { 
    arabicVoice = null;
    if (noVoiceModal && !sessionStorage.getItem('voiceWarned')) {
      noVoiceModal.classList.add('active');
      sessionStorage.setItem('voiceWarned', 'true');
    }
    populateVoiceList();
    return; 
  }
  
  if (!arabicVoice) {
    arabicVoice =
      arVoices.find(v => /google/i.test(v.name)) ||
      arVoices.find(v => /^ar-sa/i.test(v.lang)) ||
      arVoices.find(v => /^ar-eg/i.test(v.lang)) ||
      arVoices[0];
  }
  
  populateVoiceList();
}

if ('speechSynthesis' in window) {
  pickBestArabicVoice();
  window.speechSynthesis.onvoiceschanged = () => {
    pickBestArabicVoice();
  };
}

if (voiceSelect) {
  voiceSelect.addEventListener('change', () => {
    const selectedName = voiceSelect.selectedOptions[0].getAttribute('data-name');
    arabicVoice = availableVoices.find(v => v.name === selectedName);
    speak('أهلاً بك، تم تغيير الصوت بنجاح');
  });
}

function unlockVoiceOnce(){
  if(voiceUnlocked || !('speechSynthesis' in window)) return;
  voiceUnlocked = true;
  try{
    const warm = new SpeechSynthesisUtterance(' ');
    warm.volume = 0;
    window.speechSynthesis.speak(warm);
  }catch(e){}
  document.removeEventListener('touchend', unlockVoiceOnce);
  document.removeEventListener('click', unlockVoiceOnce);
}
document.addEventListener('touchend', unlockVoiceOnce, { once:true });

function speak(text) {
  if (!text || speechVolume <= 0) return;

  const cleanText = text.replace(/[\u064B-\u0652]/g, "").trim();
  if (!cleanText) return;

  // 1️⃣ الخيار الأول: تشغيل الصوت العربي الأونلاين (نطق عربي واضح ومباشر)
  const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=ar&client=tw-ob`;
  
  audioSpeechPlayer.pause();
  audioSpeechPlayer.src = googleTtsUrl;
  audioSpeechPlayer.volume = speechVolume;

  let playPromise = audioSpeechPlayer.play();

  if (playPromise !== undefined) {
    playPromise.catch(() => {
      // 2️⃣ الخيار الاحتياطي أوفلاين: الاعتماد على أصوات الجهاز المدمجة
      speakLocalFallback(cleanText);
    });
  }
}

function speakLocalFallback(cleanText) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanText);
    if (arabicVoice) u.voice = arabicVoice;
    u.lang = arabicVoice ? arabicVoice.lang : 'ar-SA';
    u.rate = 0.8; 
    u.pitch = 1.0; 
    u.volume = speechVolume;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

async function apiCall(action, payload){
  payload = payload || {};
  try{ const res = await fetch(APP_SCRIPT_URL, { method: 'POST', body: JSON.stringify(Object.assign({action: action}, payload)) }); return await res.json(); }
  catch(e){ return { ok:false, error:'في مشكلة في الاتصال' }; }
}

/* ================== DUEL MODE ================== */
let activeRoomCode = '';
let roomPollTimer = null;

function roomMsg(t){ const e = document.getElementById('roomMessage'); if(e) e.textContent = t; }

function renderDuelState(state){
  if(!state) return;
  document.getElementById('duelGameCard').style.display = 'block';
  document.getElementById('roomCodeDisplay').style.display = 'block';
  document.getElementById('roomCodeValue').textContent = activeRoomCode;

  const players = state.players || [];
  const me = currentUser ? currentUser.username : null;

  if(state.status === 'waiting'){
    document.getElementById('duelStatus').textContent = 'بننتظر صاحبك يدخل الغرفة...';
  } else if(state.status === 'finished'){
    document.getElementById('duelStatus').textContent = 'خلص التحدي! 🎉';
  } else {
    document.getElementById('duelStatus').textContent = 'اختار الحرف اللي هتسمعه';
  }

  const choices = document.getElementById('duelChoices');
  choices.innerHTML = '';
  const roundLetters = state.roundLetters;
  document.getElementById('duelListenBtn').onclick = () => { if(roundLetters) speak(LETTERS[roundLetters.correct].name); };

  if(state.status === 'playing' && roundLetters){
    const alreadyAnswered = state.answers && me && state.answers[me] !== undefined;
    roundLetters.options.forEach((letterIdx, optIdx) => {
      const letterObj = LETTERS[letterIdx];
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = letterObj.l;
      btn.disabled = !!alreadyAnswered;
      btn.onclick = () => answerDuel(optIdx);
      choices.appendChild(btn);
    });
    if(!alreadyAnswered) speak(LETTERS[roundLetters.correct].name);
  }

  const scores = state.scores || {};
  document.getElementById('duelScores').textContent = players.map(p => {
    const answered = state.answers && state.answers[p] !== undefined;
    return `${p}: ${scores[p] || 0} نجمة${answered ? ' ✓' : ''}`;
  }).join('   |   ');

  const bothAnswered = players.length >= 2 && players.every(p => state.answers && state.answers[p] !== undefined);
  document.getElementById('nextDuelBtn').style.display = (state.host === me && state.status === 'playing' && bothAnswered) ? 'inline-block' : 'none';
}

async function createDuelRoom(){
  if(!currentUser){ roomMsg('سجل دخولك الأول.'); return; }
  roomMsg('بننشئ الغرفة...');
  const r = await apiCall('createRoom', { username: currentUser.username, password: currentUser.password });
  if(!r.ok){ roomMsg(r.error || 'في مشكلة، جرب تاني.'); return; }
  activeRoomCode = r.code;
  document.getElementById('roomCodeDisplay').style.display = 'block';
  document.getElementById('roomCodeValue').textContent = r.code;
  roomMsg('الغرفة جاهزة! ابعت الكود لصاحبك.');
  startRoomPolling();
}
async function joinDuelRoom(){
  if(!currentUser){ roomMsg('سجل دخولك الأول.'); return; }
  const code = document.getElementById('joinRoomCode').value.trim().toUpperCase();
  if(!code){ roomMsg('اكتب كود الغرفة الأول.'); return; }
  roomMsg('بندخل الغرفة...');
  const r = await apiCall('joinRoom', { username: currentUser.username, password: currentUser.password, code });
  if(!r.ok){ roomMsg(r.error || 'مقدرناش ندخل الغرفة.'); return; }
  activeRoomCode = code;
  roomMsg('دخلت الغرفة! 🎉');
  startRoomPolling();
}
async function startRoomPolling(){
  if(roomPollTimer) clearInterval(roomPollTimer);
  await pollRoom();
  roomPollTimer = setInterval(pollRoom, 1800);
}
async function pollRoom(){
  if(!activeRoomCode || !currentUser) return;
  const r = await apiCall('getRoom', { username: currentUser.username, password: currentUser.password, code: activeRoomCode });
  if(!r.ok){ roomMsg(r.error || 'قطع الاتصال بالغرفة.'); return; }
  renderDuelState(r.room);
  if(r.room.status === 'finished' && roomPollTimer){ clearInterval(roomPollTimer); roomPollTimer = null; }
}
async function answerDuel(optIdx){
  if(!activeRoomCode) return;
  const r = await apiCall('answerRoom', { username: currentUser.username, password: currentUser.password, code: activeRoomCode, answer: optIdx });
  if(r.ok){
    if(r.correct){ playSFX('win'); addScore(1); } else { playSFX('lose'); }
    await pollRoom();
  } else {
    roomMsg(r.error || 'حصلت مشكلة.');
  }
}
async function nextDuelRound(){
  const r = await apiCall('nextRoomRound', { username: currentUser.username, password: currentUser.password, code: activeRoomCode });
  if(r.ok) await pollRoom(); else roomMsg(r.error || 'حصلت مشكلة.');
}
function leaveDuelRoom(){
  if(roomPollTimer){ clearInterval(roomPollTimer); roomPollTimer = null; }
  activeRoomCode = '';
  document.getElementById('duelGameCard').style.display = 'none';
  document.getElementById('roomCodeDisplay').style.display = 'none';
  roomMsg('اعمل غرفة أو اكتب كود صاحبك.');
}
document.getElementById('createRoomBtn')?.addEventListener('click', createDuelRoom);
document.getElementById('joinRoomBtn')?.addEventListener('click', joinDuelRoom);
document.getElementById('nextDuelBtn')?.addEventListener('click', nextDuelRound);
document.getElementById('leaveRoomBtn')?.addEventListener('click', leaveDuelRoom);

function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const pickHistory = {};
function pickNonRepeating(pool, key){
  if(!pool || pool.length === 0) return null;
  if(!pickHistory[key]) pickHistory[key] = [];
  const history = pickHistory[key];
  const historySize = Math.max(1, Math.min(pool.length - 1, Math.floor(pool.length * 0.7)));
  let available = pool.filter(item => !history.includes(item));
  if(available.length === 0){ history.length = 0; available = pool.slice(); }
  const choice = available[Math.floor(Math.random() * available.length)];
  history.push(choice);
  if(history.length > historySize) history.shift();
  return choice;
}

function normalizeArabic(text) {
  if(!text) return "";
  return text
    .replace(/[\u064B-\u0652]/g, "")
    .replace(/[أإآآ]/g, "ا")
    .replace(/ة/g, "ه")
    .replace(/ى/g, "ي")
    .trim();
}

/* ================== SCORE SYNC ================== */
let pendingDelta = 0;
let flushTimer = null;
let scoreRetryTimer = null;
let syncInFlight = false;

function pendingKey(){ return currentUser ? ('pendingDelta_' + currentUser.username) : null; }
function loadPendingDelta(){ if(!currentUser) return 0; try{ const v = localStorage.getItem(pendingKey()); return v ? (parseInt(v,10) || 0) : 0; }catch(e){ return 0; } }
function savePendingDelta(v){ if(!currentUser) return; try{ localStorage.setItem(pendingKey(), String(v)); }catch(e){} }

function setSyncDot(state){
  const dot = document.getElementById('syncDot');
  if(!dot) return;
  dot.classList.remove('pending', 'saved');
  if(state === 'pending') dot.classList.add('pending');
  if(state === 'saved') dot.classList.add('saved');
}

function initScoreSync(){
  pendingDelta = loadPendingDelta();
  if(pendingDelta > 0){ setSyncDot('pending'); flushScore(); }
  else { setSyncDot('saved'); }
  if(scoreRetryTimer) clearInterval(scoreRetryTimer);
  scoreRetryTimer = setInterval(()=>{ if(pendingDelta > 0 && !syncInFlight) flushScore(); }, 15000);
}

function addScore(n){
  score += n;
  updateGamificationUI(true);
  pendingDelta += n;
  savePendingDelta(pendingDelta);
  setSyncDot('pending');
  if(flushTimer) clearTimeout(flushTimer);
  flushTimer = setTimeout(flushScore, 900);
}

async function flushScore(){
  if(!currentUser || pendingDelta <= 0 || syncInFlight) return;
  syncInFlight = true;
  const deltaToSend = pendingDelta;
  const res = await apiCall('incrementScore', { username: currentUser.username, password: currentUser.password, delta: deltaToSend });
  syncInFlight = false;
  if(res && res.ok){
    pendingDelta -= deltaToSend;
    if(pendingDelta < 0) pendingDelta = 0;
    savePendingDelta(pendingDelta);
    if(typeof res.score === 'number'){ score = res.score; updateGamificationUI(false); }
    setSyncDot(pendingDelta > 0 ? 'pending' : 'saved');
  } else {
    setSyncDot('pending');
  }
}

function flushWithBeacon(){
  if(!currentUser || pendingDelta <= 0) return;
  try{
    const payload = JSON.stringify({ action:'incrementScore', username: currentUser.username, password: currentUser.password, delta: pendingDelta });
    const blob = new Blob([payload], { type: 'text/plain;charset=UTF-8' });
    navigator.sendBeacon(APP_SCRIPT_URL, blob);
    pendingDelta = 0;
    savePendingDelta(0);
  }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flushWithBeacon(); });
window.addEventListener('pagehide', flushWithBeacon);

function startListening(btnEl, errorEl, feedbackEl, onMatchCallback) {
  if (!SpeechRecognition) { 
    btnEl.disabled = true; 
    feedbackEl.textContent = 'المتصفح ده مش بيدعم المايك، جرب Chrome على أندرويد أو كمبيوتر'; 
    feedbackEl.className = 'feedback-line no'; 
    showSandboxNote();
    return; 
  }
  try {
    if(recognition) { try{ recognition.stop(); }catch(e){} }
    recognition = new SpeechRecognition(); 
    recognition.lang = 'ar-SA'; 
    recognition.continuous = false; 
    recognition.interimResults = false;
    
    recognition.onstart = () => { 
      btnEl.classList.add('recording'); 
      btnEl.textContent = '🎙️ جاري الاستماع...'; 
      feedbackEl.textContent = 'اتكلم بصوت واضح دلوقتي...'; 
      feedbackEl.className = 'feedback-line'; 
      errorEl.style.display = 'none'; 
    };
    
    recognition.onresult = (e) => { 
      btnEl.classList.remove('recording'); 
      btnEl.textContent = '🎙️ اضغط وتكلم'; 
      if(e.results && e.results[0] && e.results[0][0]){
        onMatchCallback(e.results[0][0].transcript.trim()); 
      }
    };
    
    recognition.onerror = (e) => {
      btnEl.classList.remove('recording'); 
      btnEl.textContent = '🎙️ اضغط وتكلم'; 
      feedbackEl.textContent = 'مسمعتكش كويس!'; 
      feedbackEl.className = 'feedback-line no';
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture'){ 
        errorEl.style.display = 'block'; 
        errorEl.innerHTML = '❌ مش قادرين نوصل للمايك. اتأكد إنك ديت صلاحية المايك من إعدادات المتصفح أو الموبايل.'; 
        micConfirmedBlocked = true;
        if(inSandboxedFrame) showSandboxNote();
      }
    };
    
    recognition.onend = () => { 
      btnEl.classList.remove('recording'); 
      btnEl.textContent = '🎙️ اضغط وتكلم'; 
    };
    
    recognition.start();
  } catch(err) { 
    btnEl.classList.remove('recording'); 
    btnEl.textContent = '🎙️ اضغط وتكلم'; 
    micConfirmedBlocked = true;
    if(inSandboxedFrame) showSandboxNote();
  }
}

const canvas = document.getElementById('drawCanvas'); 
const ctx = canvas.getContext('2d');
const guideCanvas = document.createElement('canvas');
const guideCtx = guideCanvas.getContext('2d');
let drawing = false; 
let drawCurrentLetter = ''; 
let drawColor = '#20263B';
let drawHistory = []; 
let guideMaskData = null; 

function initCanvasSize() { 
  const wrapper = canvas.parentElement;
  if (!wrapper) return false;
  
  const rect = wrapper.getBoundingClientRect(); 
  if (rect.width <= 0) return false;

  canvas.width = rect.width; 
  canvas.height = rect.width; 
  guideCanvas.width = rect.width;
  guideCanvas.height = rect.width;
  return true;
}

function renderDrawGuide() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = `900 ${canvas.width * 0.6}px Changa`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  
  ctx.lineWidth = 4;
  ctx.strokeStyle = "rgba(108, 91, 158, 0.35)";
  if (ctx.setLineDash) ctx.setLineDash([12, 8]);
  ctx.strokeText(drawCurrentLetter, canvas.width/2, canvas.height/2 + (canvas.height*0.05));
  if (ctx.setLineDash) ctx.setLineDash([]);
}

function buildGuideMask() {
  if (guideCanvas.width <= 0 || guideCanvas.height <= 0) return;
  
  guideCtx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);
  guideCtx.font = `900 ${guideCanvas.width * 0.6}px Changa`;
  guideCtx.textAlign = "center";
  guideCtx.textBaseline = "middle";
  guideCtx.lineWidth = guideCanvas.width * 0.16;
  guideCtx.strokeStyle = "#000";
  guideCtx.strokeText(drawCurrentLetter, guideCanvas.width/2, guideCanvas.height/2 + (guideCanvas.height*0.05));
  guideMaskData = guideCtx.getImageData(0, 0, guideCanvas.width, guideCanvas.height).data;
}

function saveCanvasState() {
  drawHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
}

function undoCanvas() {
  if (drawHistory.length > 0) {
    let previousState = drawHistory.pop();
    ctx.putImageData(previousState, 0, 0);
  } else {
    renderDrawGuide();
  }
}

function newDrawRound() { 
  if (!initCanvasSize()) return;
  drawHistory = [];
  drawCurrentLetter = pickNonRepeating(LETTERS, 'draw').l; 
  document.getElementById('drawTargetLabel').textContent = drawCurrentLetter; 
  document.getElementById('drawFeedback').textContent = '';
  document.getElementById('drawFeedback').className = 'feedback-line';
  speak(drawCurrentLetter); 
  renderDrawGuide(); 
  buildGuideMask();
}

function startPosition(e) { 
  saveCanvasState();
  drawing = true; 
  draw(e); 
}

function endPosition() { 
  drawing = false; 
  ctx.beginPath(); 
}

function draw(e) {
  if (!drawing) return; e.preventDefault();
  const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
  let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
  let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
  let x = (clientX - rect.left) * scaleX; let y = (clientY - rect.top) * scaleY;
  
  if (ctx.setLineDash) ctx.setLineDash([]);
  ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = drawColor;
  ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
}

canvas.addEventListener('mousedown', startPosition); canvas.addEventListener('mouseup', endPosition); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseout', endPosition);
canvas.addEventListener('touchstart', startPosition, {passive: false}); canvas.addEventListener('touchend', endPosition); canvas.addEventListener('touchmove', draw, {passive: false});

document.querySelectorAll('.color-swatch').forEach(swatch => { swatch.addEventListener('click', (e) => { document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active')); e.target.classList.add('active'); drawColor = e.target.dataset.color; }); });
document.getElementById('undoCanvasBtn').addEventListener('click', undoCanvas);
document.getElementById('clearCanvasBtn').addEventListener('click', () => { drawHistory = []; renderDrawGuide(); document.getElementById('drawFeedback').textContent=''; document.getElementById('drawFeedback').className='feedback-line'; }); 
document.getElementById('nextDrawBtn').addEventListener('click', newDrawRound);
window.addEventListener('resize', () => { if(document.getElementById('screen-draw').classList.contains('active')) { initCanvasSize(); renderDrawGuide(); buildGuideMask(); } });

function checkDrawing(){
  if(!guideMaskData) return null;
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  let inkCount = 0, overlapCount = 0, guideCount = 0;
  const step = 8;
  for(let i = 3; i < img.length; i += step){
    const inkAlpha = img[i];
    const guideAlpha = guideMaskData[i];
    if(guideAlpha > 10) guideCount++;
    if(inkAlpha > 10){
      inkCount++;
      if(guideAlpha > 10) overlapCount++;
    }
  }
  if(inkCount < 25) return { score: 0, empty: true };
  const coverage = guideCount ? overlapCount / guideCount : 0;
  const precision = inkCount ? overlapCount / inkCount : 0;
  const score = coverage * 0.6 + precision * 0.4;
  return { score, coverage, precision };
}

document.getElementById('checkDrawBtn').addEventListener('click', () => {
  const result = checkDrawing();
  const fb = document.getElementById('drawFeedback');
  if(!result || result.empty){
    fb.textContent = 'ارسم على اللوحة الأول ✏️';
    fb.className = 'feedback-line no';
    return;
  }
  const pct = Math.round(result.score * 100);
  if(result.score >= 0.5){
    fb.textContent = `ممتاز! 🎉 دقة الرسم ${pct}%`;
    fb.className = 'feedback-line ok pop';
    playSFX('win'); addScore(3);
    setTimeout(newDrawRound, 1700);
  }else{
    fb.textContent = `حاول تاني، اتبع خط الحرف بدقة أكتر (${pct}%) ✏️`;
    fb.className = 'feedback-line no shake';
    playSFX('lose');
  }
});

/* 5. Missing Letter Game */
let missingTargetPart = null; let missingLock = false;
function newMissingRound(){
  missingLock = false; document.getElementById('missingFeedback').textContent = ''; document.getElementById('missingFeedback').className = 'feedback-line';
  const targetWord = pickNonRepeating(wordsForJourney(), 'missing'); const missingIndex = Math.floor(Math.random() * targetWord.parts.length); missingTargetPart = targetWord.parts[missingIndex];
  document.getElementById('missingEmoji').textContent = targetWord.emoji; speak(targetWord.word);
  const disp = document.getElementById('missingWordDisplay'); disp.innerHTML = '';
  targetWord.parts.forEach((p, i) => { const slot = document.createElement('div'); if(i === missingIndex){ slot.className = 'missing-slot'; slot.textContent = '?'; slot.id = 'activeMissingSlot'; } else { slot.className = 'missing-slot filled'; slot.textContent = p; } disp.appendChild(slot); });
  const opts = shuffle([missingTargetPart, ...shuffle([...new Set(wordsForJourney().flatMap(w => w.parts))].filter(p => p !== missingTargetPart)).slice(0, 2)]);
  document.getElementById('missingOptions').innerHTML = '';
  opts.forEach(opt => { const btn = document.createElement('button'); btn.className = 'pool-letter'; btn.style.width='80px'; btn.style.height='80px'; btn.style.fontSize='2.5rem'; btn.textContent = opt;
    btn.onclick = () => { if(missingLock) return; speak(opt); missingLock = true; if(opt === missingTargetPart){ btn.classList.add('correct'); document.getElementById('activeMissingSlot').textContent = opt; document.getElementById('activeMissingSlot').classList.add('filled'); document.getElementById('missingFeedback').textContent = 'بطل! 🎉'; document.getElementById('missingFeedback').className = 'feedback-line ok pop'; playSFX('win'); addScore(2); setTimeout(newMissingRound, 1500); } else { btn.classList.add('wrong'); document.getElementById('missingFeedback').textContent = 'غلط ❌'; document.getElementById('missingFeedback').className = 'feedback-line no shake'; playSFX('lose'); setTimeout(()=>{ missingLock = false; btn.classList.remove('wrong'); document.getElementById('missingFeedback').classList.remove('shake'); }, 800); } };
    document.getElementById('missingOptions').appendChild(btn); });
}

/* 6. Match Game */
let matchLock = false;
function newMatchRound(){
  matchLock = false; document.getElementById('matchFeedback').textContent = '';
  const correct = pickNonRepeating(LETTERS, 'match'); const options = shuffle([correct, ...shuffle(LETTERS.filter(x=>x.l !== correct.l)).slice(0,2)]);
  document.getElementById('matchLetter').textContent = correct.l; speak(correct.name); const cont = document.getElementById('matchOptions'); cont.innerHTML = '';
  options.forEach(opt=>{ const btn = document.createElement('button'); btn.className = 'option-btn'; btn.textContent = opt.emoji;
    btn.onclick = ()=>{ if(matchLock) return; matchLock = true; if(opt.l === correct.l){ btn.classList.add('correct'); document.getElementById('matchFeedback').textContent = 'صح 🎉'; document.getElementById('matchFeedback').className = 'feedback-line ok pop'; playSFX('win'); addScore(1); setTimeout(newMatchRound, 1400); }else{ btn.classList.add('wrong'); document.getElementById('matchFeedback').textContent = 'غلط ❌'; document.getElementById('matchFeedback').className = 'feedback-line no shake'; playSFX('lose'); setTimeout(newMatchRound, 1500); } }; cont.appendChild(btn); });
}

/* 9. Build Word */
let buildTarget = null, builtSoFar = [];
function newBuildRound(){
  document.getElementById('buildFeedback').textContent = ''; buildTarget = pickNonRepeating(wordsForJourney(), 'build'); builtSoFar = []; document.getElementById('buildEmoji').textContent = buildTarget.emoji; speak(buildTarget.word); document.getElementById('speakWordBtn').onclick = () => speak(buildTarget.word);
  const blanks = document.getElementById('blanksRow'); blanks.innerHTML = ''; buildTarget.parts.forEach(()=>{ const s = document.createElement('div'); s.className = 'blank-slot'; blanks.appendChild(s); });
  let scrambled = shuffle(buildTarget.parts); if(scrambled.join('') === buildTarget.parts.join('') && scrambled.length > 1) scrambled = shuffle(buildTarget.parts);
  const pool = document.getElementById('poolRow'); pool.innerHTML = '';
  scrambled.forEach(part=>{ const btn = document.createElement('button'); btn.className = 'pool-letter'; btn.textContent = part; btn.dataset.used = 'false';
    btn.onclick = ()=>{ if(btn.dataset.used === 'true') return; speak(part); btn.dataset.used = 'true'; btn.classList.add('used'); builtSoFar.push(part); blanks.children[builtSoFar.length-1].textContent = part; blanks.children[builtSoFar.length-1].classList.add('filled');
      if(builtSoFar.length === buildTarget.parts.length){ if(builtSoFar.join('') === buildTarget.parts.join('')){ document.getElementById('buildFeedback').textContent = 'صح 🎉'; document.getElementById('buildFeedback').className = 'feedback-line ok pop'; playSFX('win'); addScore(2); setTimeout(newBuildRound, 1500); }else{ document.getElementById('buildFeedback').textContent = 'غلط ❌'; document.getElementById('buildFeedback').className = 'feedback-line no shake'; playSFX('lose'); setTimeout(()=>{ builtSoFar = []; [...blanks.children].forEach(s=>{ s.textContent=''; s.classList.remove('filled'); }); [...pool.children].forEach(b=>{ b.dataset.used='false'; b.classList.remove('used'); }); document.getElementById('buildFeedback').textContent = ''; }, 1000); } } }; pool.appendChild(btn); });
}
document.getElementById('clearBtn').onclick = ()=>{ builtSoFar = []; [...document.getElementById('blanksRow').children].forEach(s=>{ s.textContent=''; s.classList.remove('filled'); }); [...document.getElementById('poolRow').children].forEach(b=>{ b.dataset.used='false'; b.classList.remove('used'); }); };
document.getElementById('skipBtn').onclick = newBuildRound;
